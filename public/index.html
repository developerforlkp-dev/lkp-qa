<body>
  <script>


    // Insert this script in your index.html right after the <body> tag.
    // This will help to prevent a flash if dark mode is the default.

    (function () {
      var storageKey = 'darkMode';
      var classNameDark = 'dark-mode';
      var classNameLight = 'light-mode';

      function setClassOnDocumentBody(isDark) {
        if (isDark) {
          document.body.classList.add(classNameDark);
          document.body.classList.remove(classNameLight);
        } else {
          document.body.classList.add(classNameLight);
          document.body.classList.remove(classNameDark);
        }
      }

      function applyTheme() {
        var localStorageTheme = null;
        try {
          localStorageTheme = localStorage.getItem(storageKey);
        } catch (err) { }

        var isDarkMode = false;
        if (localStorageTheme !== null && localStorageTheme !== undefined) {
          try {
            isDarkMode = JSON.parse(localStorageTheme) === true;
          } catch (e) {
            isDarkMode = localStorageTheme === 'true';
          }
        } else {
          // Default to light theme and persist so system dark mode on iOS does not hijack it
          isDarkMode = false;
          try {
            localStorage.setItem(storageKey, JSON.stringify(false));
          } catch (err) { }
        }

        setClassOnDocumentBody(isDarkMode);
      }

      applyTheme();

      // Ensure theme is preserved when returning via iOS Safari Back/Forward cache (BFCache)
      window.addEventListener('pageshow', function () {
        applyTheme();
      });
    })();
  </script>
